[project]
name = "casebook"
version = "0.1.0"
description = "Product-analytics case studies in BigQuery SQL on public e-commerce data, tested on DuckDB"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
