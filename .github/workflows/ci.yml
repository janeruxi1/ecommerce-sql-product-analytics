name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff==0.6.9
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (every query run on DuckDB fixtures with known answers)
        run: pytest -q
